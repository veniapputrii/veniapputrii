name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install github-status
        run: go install github.com/tbxark/github-status@latest

      - name: Generate statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CUSTOM_ACTOR: veniapputrii
          ANIMATION: true
        run: |
          $(go env GOPATH)/bin/github-status

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add overview.svg languages.svg

          git diff --cached --quiet && exit 0

          git commit -m "Update GitHub statistics"
          git push
